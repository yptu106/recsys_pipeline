# run_ranker.yaml

# inference setting
test_path: "data/splits/donate/test.parquet"
user_ids: None
topk: 100

# Retrieval
retrieval_dir: "results/retrieval/MiniLM_40epoch/item_sentence"

# User and item embedding directories
user_emb_dir: "embeddings/user/MiniLM_40epoch/item_sentence"
streamer_emb_dir: "embeddings/streamer/MiniLM_40epoch/item_sentence"

# Model checkpoint to load
model: "cross_interaction"  # Options: "mlp", "transformer"
model_path: "ranker/checkpoints/cross_interaction/pointwise/cross_interaction.pth"
d_model: 256

# Fallback user embedding (optional)
fallback:
  emb_path: "embeddings/streamer/MiniLM_40epoch/item_sentence/embeddings.npy"
  lookup_path: "embeddings/streamer/MiniLM_40epoch/item_sentence/lookup.parquet"
  user_log_path: "data/splits/donate/interactions_train.parquet"
  n_fallback: 20
  max_history: 50

# Output directory
out_dir: "results/ranked/cross_interaction/pointwise"
