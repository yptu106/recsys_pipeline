gpu_id: '1' 

# Required dataset name (should match subdirectory under `data/`)
dataset: livestream_w_ts_3_months
data_path: data/atomic/

# Path to save the trained model checkpoint
checkpoint_dir: src/ranker/recbole/checkpoints/SASRec/livestream_w_ts_3_months
log_root: src/ranker/recbole/log
tensorboard_dir: src/ranker/recbole/log_tensorboard

# Field mapping
USER_ID_FIELD: user_id
ITEM_ID_FIELD: streamer_id
TIME_FIELD: timestamp
load_col:
  inter: [user_id, streamer_id, timestamp]
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50

# Model config
model: SASRec
embedding_size: 64
hidden_size: 128
num_layers: 1
dropout_prob: 0.3
loss_type: 'CE'

# Training and evaluation config
epochs: 500
train_batch_size: 4096
eval_batch_size: 4096
train_neg_sample_args: ~
eval_args:
    group_by: user
    order: TO
    split: {'LS': 'valid_and_test'}
    mode: full
metrics: ['Recall', 'MRR', 'NDCG', 'Hit', 'Precision']
topk: 10
valid_metric: MRR@10
metric_decimal_place: 4